name: build
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld git xz-utils >/dev/null
          clang --version | head -1
          ls /usr/bin | grep -i lld || true
      - name: ios-sdk
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          du -sh /tmp/sdks/iPhoneOS16.5.sdk || true
          ls /tmp/sdks/iPhoneOS16.5.sdk | head
      - name: build
        run: |
          set -x
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          mkdir -p out
          clang++ -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -fobjc-arc -std=c++17 -O2 -dynamiclib -fuse-ld=lld \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -Wl,-undefined,dynamic_lookup -Wl,-headerpad_max_install_names \
            MadOutBT.mm -o out/MadOutBT.dylib
          file out/MadOutBT.dylib
          ls -l out/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: MadOutBT, path: out/MadOutBT.dylib }