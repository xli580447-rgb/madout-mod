name: build-linux
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake make git xz-utils libssl-dev >/dev/null
          clang --version | head -1
          ld64.lld --version | head -1 || true

      - name: ios sdk
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          ls /tmp/sdks/iPhoneOS16.5.sdk | head
          du -sh /tmp/sdks
      - name: build dobby
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git /tmp/dobby
          cd /tmp/dobby
          cat > /tmp/tc.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_SYSROOT /tmp/sdks/iPhoneOS16.5.sdk)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 14.0)
          set(CMAKE_C_COMPILER clang)
          set(CMAKE_CXX_COMPILER clang++)
          set(CMAKE_C_COMPILER_TARGET arm64-apple-ios14.0)
          set(CMAKE_CXX_COMPILER_TARGET arm64-apple-ios14.0)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/tmp/tc.cmake -DCMAKE_BUILD_TYPE=Release -DDOBBY_GENERATE_SHARED=OFF || tail -50 CMakeFiles/CMakeError.log 2>/dev/null
          make -j$(nproc) 2>&1 | tail -30
          find /tmp/dobby -name "*.a" | tee /tmp/libs.txt
      - name: build dylib
        run: |
          set -e
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          LIB=$(grep -m1 libdobby.a /tmp/libs.txt || head -1 /tmp/libs.txt)
          echo "lib=$LIB"
          mkdir -p out
          clang++ -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -fobjc-arc -std=c++17 -O2 -dynamiclib -fuse-ld=lld \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -Wl,-undefined,dynamic_lookup \
            MadOutBT.mm "$LIB" -o out/MadOutBT.dylib
          file out/MadOutBT.dylib; ls -l out/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: MadOutBT, path: out/MadOutBT.dylib }